<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="emojiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="50%" stop-color="#FFE4EC" />
      <stop offset="100%" stop-color="#FFD6E3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5C8D" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="320" fill="url(#emojiGrad)" rx="16"/>

  <!-- Decorative dashed border -->
  <rect x="12" y="12" width="376" height="296" fill="none" stroke="#FF9EBB" stroke-width="2" stroke-dasharray="6,6" rx="14"/>

  <!-- Floating emojis in background -->
  <text x="35" y="55" font-size="22" opacity="0.85">✨</text>
  <text x="345" y="60" font-size="24" opacity="0.85">⭐</text>
  <text x="40" y="275" font-size="22" opacity="0.85">🍕</text>
  <text x="340" y="270" font-size="24" opacity="0.85">🎮</text>
  <text x="40" y="160" font-size="20" opacity="0.7">🎈</text>
  <text x="340" y="160" font-size="20" opacity="0.7">🧃</text>

  <!-- Central Cloud/Circle Card -->
  <rect x="60" y="45" width="280" height="150" rx="24" fill="#FFFFFF" filter="url(#shadow)"/>
  
  <!-- Sibling Emojis -->
  <text x="135" y="125" font-size="52" text-anchor="middle">👦🏻</text>
  <text x="200" y="122" font-size="34" text-anchor="middle">💖</text>
  <text x="265" y="125" font-size="52" text-anchor="middle">👧🏻</text>

  <!-- Sibling Badge -->
  <rect x="100" y="150" width="200" height="28" rx="14" fill="#FFEBF2" stroke="#FF85A2" stroke-width="1.2"/>
  <text x="200" y="169" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#D81B60" text-anchor="middle">
    BEST BROTHER EVER 🤜🤛
  </text>

  <!-- Subtitle -->
  <text x="200" y="230" font-family="'Playfair Display', serif" font-weight="700" font-size="18" fill="#5A1C38" text-anchor="middle">
    Partner in Crime &amp; Protector
  </text>

  <text x="200" y="255" font-family="'Caveat', cursive" font-size="18" fill="#FF5C8D" text-anchor="middle">
    fighting over the remote · having each other's back forever ♡
  </text>
</svg>
